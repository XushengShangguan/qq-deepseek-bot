# NapCat (QQ <-> OneBot 11) for the companion app.
# Start:  cd napcat && docker compose up -d
# Login:  open http://127.0.0.1:6099/webui (token is WEBUI_TOKEN in napcat/.env), scan QR with the bot's QQ account
services:
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: napcat
    restart: unless-stopped
    # QQ fingerprints the "device" partly by MAC address and hostname. Docker
    # randomizes both whenever the container is recreated, which looks like the
    # bot account jumping to a new machine and invites risk-control logouts.
    # Pin them to the values the account first logged in with.
    hostname: baffc2ac17c0
    mac_address: "52:fc:37:40:5b:84"
    environment:
      WEBUI_TOKEN: ${WEBUI_TOKEN}
      # Bot QQ number (set in napcat/.env): after a QQ crash/restart, log back in
      # with the saved session instead of asking for a new QR scan.
      ACCOUNT: ${ACCOUNT}
      # Also used when NapCat restarts QQ internally (which drops -q).
      NAPCAT_QUICK_ACCOUNT: ${ACCOUNT}
      # When Tencent invalidates the login (kicked offline), log back in with
      # the password instead of waiting for a QR scan. MD5 of the bot QQ's
      # password, set in .env; empty = QR only. Risk-control blocks (slider /
      # SMS verification) still need a manual login.
      NAPCAT_QUICK_PASSWORD_MD5: ${NAPCAT_QUICK_PASSWORD_MD5:-}
    ports:
      - "127.0.0.1:6099:6099"   # WebUI (QR login, settings)
      - "127.0.0.1:3001:3001"   # OneBot HTTP API, used by the app to send messages
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets NapCat reach the app on the Mac
    volumes:
      - ./data/qq:/app/.config/QQ
      - ./data/config:/app/napcat/config
      - ./data/plugins:/app/napcat/plugins
