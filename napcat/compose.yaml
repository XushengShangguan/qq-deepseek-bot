# NapCat (QQ <-> OneBot 11) for the companion app.
# Start:  cd napcat && docker compose up -d
# Login:  open http://127.0.0.1:6099/webui (token is WEBUI_TOKEN in napcat/.env), scan QR with the bot's QQ account
services:
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: napcat
    restart: unless-stopped
    environment:
      WEBUI_TOKEN: ${WEBUI_TOKEN}
    ports:
      - "127.0.0.1:6099:6099"   # WebUI (QR login, settings)
      - "127.0.0.1:3001:3001"   # OneBot HTTP API, used by the app to send messages
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets NapCat reach the app on the Mac
    volumes:
      - ./data/qq:/app/.config/QQ
      - ./data/config:/app/napcat/config
      - ./data/plugins:/app/napcat/plugins
